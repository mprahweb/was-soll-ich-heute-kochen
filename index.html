<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Was soll ich heute kochen?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Was soll ich heute kochen?</h1>
    <p>Wähle deine Lebensmittel aus und erhalte Rezeptvorschläge für 5 Tage</p>
  </header>

  <main class="container">
    <!-- Ingredient Selection -->
    <div class="section">
      <h2 class="section-title">
        <span class="icon">🥗</span>
        Lebensmittel auswählen
        <span class="counter" id="selectedCount" style="display:none">0</span>
      </h2>
      <div class="category-tabs" id="categoryTabs"></div>
      <div class="ingredient-grid" id="ingredientGrid"></div>
    </div>

    <!-- Selected Ingredients -->
    <div class="section">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem">
        <h2 class="section-title" style="margin-bottom:0">
          <span class="icon">✅</span>
          Ausgewählte Lebensmittel
        </h2>
        <button class="clear-btn" id="clearBtn">Alle entfernen</button>
      </div>
      <div class="selected-bar" id="selectedBar"></div>
    </div>

    <!-- Generate Button -->
    <button class="generate-btn" id="generateBtn" disabled>
      Rezeptvorschläge für 5 Tage generieren
    </button>

    <!-- Results -->
    <div id="resultsSection" style="display:none; margin-top:1.5rem">
      <div class="section">
        <h2 class="section-title">
          <span class="icon">📅</span>
          Dein 5-Tage Essensplan
        </h2>
        <div id="mealPlan"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    Was soll ich heute kochen? &mdash; Dein Rezeptplaner
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
